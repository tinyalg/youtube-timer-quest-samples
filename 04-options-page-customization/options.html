<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Timer Settings</title>
  <style>
    body { padding: 20px; font-family: sans-serif; max-width: 500px; margin: 0 auto; }
    h1 { font-size: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
    
    /* 入力エリアのデザイン */
    .input-group { display: flex; gap: 10px; margin-bottom: 20px; }
    input { flex: 1; padding: 8px; font-size: 16px; }
    button { padding: 8px 16px; cursor: pointer; background: #28a745; color: white; border: none; border-radius: 4px; }
    button:hover { background: #218838; }
    
    /* リストのデザイン */
    ul { list-style: none; padding: 0; }
    li { background: #f8f9fa; border: 1px solid #ddd; padding: 10px; margin-bottom: 5px; display: flex; justify-content: space-between; align-items: center; }
    .delete-btn { background: #dc3545; font-size: 12px; padding: 5px 10px; }
    .delete-btn:hover { background: #c82333; }
  </style>
</head>
<body>
  <h1>監視対象サイトの設定</h1>
  
  <div class="input-group">
    <input type="text" id="site-input" placeholder="例: netflix.com">
    <button id="add-btn">追加</button>
  </div>

  <ul id="site-list">
    </ul>

  <script src="options.js"></script>
</body>
</html>
