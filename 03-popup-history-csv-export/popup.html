<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    /* 簡易的なCSS（見た目）の定義 */
    body { width: 300px; font-family: sans-serif; padding: 10px; }
    h1 { font-size: 16px; border-bottom: 1px solid #ddd; padding-bottom: 5px; }
    table { width: 100%; border-collapse: collapse; margin-bottom: 15px; }
    th, td { text-align: left; padding: 5px; border-bottom: 1px solid #eee; }
    
    /* 押しやすいボタンのデザイン */
    button { width: 100%; padding: 8px; cursor: pointer; background: #007bff; color: white; border: none; border-radius: 4px; }
    button:hover { background: #0056b3; }
  </style>
</head>
<body>
  <h1>YouTube視聴履歴</h1>
  
  <table id="history-table">
    <thead>
      <tr><th>日付</th><th>時間 (秒)</th></tr>
    </thead>
    <tbody></tbody>
  </table>

  <button id="download-btn">CSVをダウンロード</button>

  <script src="popup.js"></script>
</body>
</html>
